name: Update drawings

on:
  schedule:
    - cron: "15 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest official drawings
        run: |
          curl -fsSL -A "Mozilla/5.0" -o pb.tmp https://www.texaslottery.com/export/sites/lottery/Games/Powerball/Winning_Numbers/powerball.csv
          curl -fsSL -A "Mozilla/5.0" -o mm.tmp https://www.texaslottery.com/export/sites/lottery/Games/Mega_Millions/Winning_Numbers/megamillions.csv
          if [ "$(grep -c '^Powerball,' pb.tmp)" -gt 1000 ]; then mv pb.tmp powerball.csv; fi
          if [ "$(grep -c '^Mega Millions,' mm.tmp)" -gt 1000 ]; then mv mm.tmp megamillions.csv; fi
          rm -f pb.tmp mm.tmp
      - name: Save the new drawings
        run: |
          git config user.name "drawings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add powerball.csv megamillions.csv
          git diff --cached --quiet || git commit -m "Update drawings"
          git push
